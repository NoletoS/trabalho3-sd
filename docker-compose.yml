services:
  db:
    image: postgres:16-alpine
    container_name: media_processor_db
    restart: always
    environment:
      POSTGRES_USER: media_app
      POSTGRES_PASSWORD: troque_esta_senha
      POSTGRES_DB: media_processor
    ports:
      - "5432:5432"
    volumes:
      - media_processor_pgdata:/var/lib/postgresql/data

volumes:
  media_processor_pgdata:
